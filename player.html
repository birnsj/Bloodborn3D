<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BloodBound</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { display: block; width: 100vw; height: 100vh; }
      #status {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
        padding: 8px 14px; border-radius: 6px; background: rgba(0, 0, 0, 0.7);
        color: #ddd; font: 14px system-ui, sans-serif; pointer-events: none;
      }
      #status[data-error='true'] { color: #ff8a8a; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="status"></div>
    <script type="module" src="/src/player/main.js"></script>
  </body>
</html>
